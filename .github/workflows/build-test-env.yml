# This workflow runs tests for the ormir-xct Python environment

name: Test ormir-xct Python Env on Mac, Linux, Windows

on: [push]

jobs:
  test-windows-linux:
    name: Windows and Linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version:: ["3.11"]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniconda-version: latest
          auto-update-conda: false
          auto-activate-base: false
          activate-environment: ormir-xct
          environment-file: environment.yml
      - name: Install ormir-xct
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check ormir-xct install
        run: |
          conda info
          conda list
          python -V
          python -c "import itk; print('itk ok')"
          python -c "import vtk; print('vtk ok')"
          python -c "import SimpleITK; print('SimpleITK ok')"
          python -c "import itk; image_io = itk.ScancoImageIO.New(); print('itk_ioscanco ok')"
          
  test-apple-silicon:
    name: Apple Silicon
    runs-on: macos-15
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          miniconda-version: latest
          auto-update-conda: false
          auto-activate-base: false
          activate-environment: ormir-xct
      - name: Install ormir-xct
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check ormir-xct install
        run: |
          conda info
          conda list
          python -V
          python -c "import itk; print('itk ok')"
          python -c "import vtk; print('vtk ok')"
          python -c "import SimpleITK; print('SimpleITK ok')"
          python -c "import itk; image_io = itk.ScancoImageIO.New(); print('itk_ioscanco ok')"