[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ormir-xct"
dynamic = ["version", "dependencies"]
description = "A Python package for high-resolution CT image processing"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    {name = "Michael T. Kuczynski", email = "mkuczyns@ucalgary.ca"},
]
keywords = ["ORMIR", "ORMIR-XCT", "HR-pQCT", "microCT", "PCCT"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3"
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black",
    "hypothesis",
    "pytest",
    "ruff"
]

[project.urls]
"Download" = "https://github.com/ORMIR-XCT/ORMIR-XCT/releases"
"Source"   = "https://github.com/ORMIR-XCT/ORMIR-XCT"
"Homepage" = "https://github.com/ORMIR-XCT"

[project.scripts]
autocontour = "ormir-xct.workflows.autocontour_workflow:autocontour_workflow"
autocontour_gobj = "ormir-xct.workflows.autocontour_gobj_workflow:autocontour_gobj_workflow"
bmd_masked = "ormir-xct.workflows.bmd_masked_workflow:bmd_masked_workflow"
bmd = "ormir-xct.workflows.bmd_workflow:bmd_workflow"
connected_check = "ormir-xct.workflows.connected_check_workflow:connected_check_workflow"
fft_laplace = "ormir-xct.workflows.fft_laplace_workflow:fft_laplace_workflow"
gauss_seg = "ormir-xct.workflows.gauss_seg_workflow:gauss_seg_workflow"
jsw_main = "ormir-xct.workflows.jsw_main_workflow:jsw_main_workflow"
local_adaptive_threshold = "ormir-xct.workflows.local_adaptive_threshold_workflow:local_adaptive_threshold_workflow"


[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["ormir-xct*"]
exclude = ["manuscript*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
tag_regex      = "^v?(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.ruff]
target-version = "py312"
line-length = 88

select = [
    "E",   # PEP8 errors
    "F",   # pyflakes (undefined, unused)
    "W",   # warnings
    "I",   # import sorting
    "B",   # real bug patterns
    "UP",  # modern Python usage
]

extend-exclude = [
    ".git",
    ".gitignore",
    "__pycache__",
    "docs",
    "build",
    "dist",
]

[tool.ruff.lint]
lint.ignore = [
    "E203",  # needed for Black compatibility
    "E501",  # line length
    "W503",  # line breaks before binary operators
]

[tool.black]
line-length = 88
target-version = ["py312"]
